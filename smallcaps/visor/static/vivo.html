<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En vivo · small caps</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/base.css">
<style>
  /* Esta vista se mira mientras se opera, no se estudia. Todo lo que decide una
     orden —cuantas acciones, donde el stop, cuanto queda de presupuesto— tiene
     que leerse sin buscar. Lo demas es contexto y va en gris. */

  body{height:auto;min-height:100%}
  main{padding:var(--e4) var(--e5) var(--e6);max-width:1500px}

  .tope{position:sticky;top:0;z-index:10;background:var(--fondo);
        padding:var(--e3) 0 var(--e3);display:flex;align-items:center;
        gap:var(--e4);flex-wrap:wrap;border-bottom:1px solid var(--borde)}
  .tope input{width:74px}
  .pulso{display:inline-block;width:7px;height:7px;border-radius:50%;
         background:var(--verde);margin-right:6px;vertical-align:middle}
  .pulso.frio{background:var(--texto-3)}
  @keyframes lat{0%,100%{opacity:1}50%{opacity:.25}}
  .vivo .pulso{animation:lat 2s ease-in-out infinite}

  .receta{color:var(--texto-3);font-size:var(--t1);
          font-family:var(--fuente-num)}

  .papel{margin-top:var(--e5);border:1px solid var(--borde);
         border-radius:var(--radio);overflow:hidden;background:var(--fondo-2)}
  .cab{display:flex;align-items:baseline;gap:var(--e4);flex-wrap:wrap;
       padding:var(--e3) var(--e4);border-bottom:1px solid var(--borde)}
  .cab .tk{font-size:var(--t4);font-weight:600;letter-spacing:.02em}
  .cab .px{font-family:var(--fuente-num);font-size:var(--t3)}
  .cab .meta{color:var(--texto-3);font-size:var(--t1);
             font-family:var(--fuente-num)}

  /* La franja de decision: las tres cifras que se miran antes de mandar. */
  .franja{display:flex;gap:var(--e5);flex-wrap:wrap;
          padding:var(--e3) var(--e4);background:var(--fondo-3)}
  .cif{display:flex;flex-direction:column;gap:2px}
  .cif .n{font-family:var(--fuente-num);font-variant-numeric:tabular-nums;
          font-size:var(--t4);line-height:1.1}
  .cif .r{color:var(--texto-3);font-size:var(--t0);text-transform:uppercase;
          letter-spacing:.06em}
  .pos{color:var(--verde)} .neg{color:var(--rojo)}

  .alerta{padding:var(--e3) var(--e4);background:rgba(239,83,80,.12);
          color:var(--rojo);font-size:var(--t1);border-top:1px solid var(--borde)}
  .descarte{padding:var(--e4);color:var(--texto-3);font-size:var(--t2)}
  .descarte li{margin:2px 0}

  .g{height:420px}

  table{width:100%;border-collapse:collapse;font-size:var(--t1);
        font-family:var(--fuente-num);font-variant-numeric:tabular-nums}
  th{color:var(--texto-3);font-weight:500;text-transform:uppercase;
     font-size:var(--t0);letter-spacing:.06em;text-align:right;
     padding:6px var(--e3);border-bottom:1px solid var(--borde)}
  th:first-child,td:first-child{text-align:left}
  td{padding:5px var(--e3);border-bottom:1px solid var(--borde-2)}
  td:not(:first-child){text-align:right}
  tr.abierta td{color:var(--texto)}
  tr.cerrada td{color:var(--texto-3)}
  .chip{display:inline-block;padding:1px 7px;border-radius:99px;
        font-size:var(--t0);letter-spacing:.04em}
  .chip.ab{background:rgba(38,166,154,.16);color:var(--verde)}
  .chip.st{background:rgba(239,83,80,.16);color:var(--rojo)}

  .vacio{padding:var(--e6);text-align:center;color:var(--texto-3)}
  .vacio code{color:var(--texto-2)}
  .aviso{margin-top:var(--e5);padding:var(--e3) var(--e4);
         border:1px solid var(--borde);border-radius:var(--radio);
         color:var(--texto-3);font-size:var(--t1)}
</style>
</head>
<body>
<main>
  <div class="tope" id="tope">
    <h1 style="margin:0;font-size:var(--t4)">
      <span class="pulso" id="pulso"></span>En vivo
    </h1>
    <label>riesgo <input id="riesgo" type="number" value="400" step="50" min="50"></label>
    <label>piso <input id="piso" type="number" value="2" step="0.5" min="0"></label>
    <label><input id="auto" type="checkbox" checked> refrescar</label>
    <span class="receta" id="receta"></span>
    <span class="receta" id="reloj" style="margin-left:auto"></span>
  </div>
  <div id="cuerpo"></div>
  <div class="aviso">
    Las órdenes las ponés vos. Esta pantalla no manda nada.
    Las velas son de <b>1 minuto</b> y sólo se escribe la vela ya
    <b>cerrada</b>: nunca aparece algo nuevo más de una vez por minuto.
    Entrar un minuto tarde cuesta <b>2%</b> del retorno —está medido—, así que
    no corras.
  </div>
</main>
<script src="/static/lightweight-charts.js"></script>
<script src="/static/grafico.js"></script>
<script src="/static/vivo.js"></script>
<script src="/static/chrome.js"></script>
</body>
</html>
