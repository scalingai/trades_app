<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial · small caps</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  /* Sistema, tokens y primitivos: base.css. Aca solo lo propio de esta vista. */

  body{display:flex;flex-direction:column;overflow:hidden}
  #est{min-width:280px}

  main{display:grid;grid-template-rows:auto 1fr;flex:1;min-height:0}
  #curva{height:190px;border-bottom:1px solid var(--linea-2);position:relative}
  .tabla{overflow:auto;min-height:0}
  .tabla th:first-child,.tabla th:nth-child(2),
  .tabla td:first-child,.tabla td:nth-child(2){text-align:left}
  .tabla tr{cursor:pointer}

  /* La comparativa de variantes. Antes crecia sin tope y se comia la pantalla
     entera: con 390 estrategias, la curva y la tabla de trades quedaban abajo
     de todo y nunca se veian juntas. Ahora tiene su propio scroll y un techo. */
  .comp{
    max-height:32vh;overflow:auto;min-height:0;
    padding:0 var(--e5) var(--e3);border-bottom:1px solid var(--linea-2);
  }
  .comp th{background:var(--fondo)}
  .comp td{padding:3px var(--e3);cursor:pointer}
  .comp tr.sel td{background:var(--fondo-4);color:var(--texto)}
</style>
</head>
<body>
<div class="tope">
  <h1>Historial</h1>
  <select id="est"></select>
  <span class="sep"></span>
  <div class="kpis" id="kpis"></div>
</div>

<div class="comp" id="comp"></div>

<main>
  <div id="curva"></div>
  <div class="tabla">
    <table>
      <thead><tr>
        <th data-c="ticker">ticker</th>
        <th data-c="d">fecha</th>
        <th data-c="hora_entrada">entra</th>
        <th data-c="hora_salida">sale</th>
        <th data-c="precio_entrada">precio</th>
        <th data-c="precio_salida">salida</th>
        <th data-c="stop_pct">stop%</th>
        <th data-c="acciones">acc.</th>
        <th data-c="ret_pct">ret%</th>
        <th data-c="pnl">PnL $</th>
        <th data-c="mae_pct">MAE%</th>
        <th data-c="mfe_pct">MFE%</th>
        <th data-c="motivo">salió por</th>
        <th data-c="expansion">exp%</th>
        <th data-c="periodo">per</th>
      </tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </div>
</main>

<script src="/static/chrome.js"></script>
<script src="/static/lightweight-charts.js"></script>
<script src="/static/historial.js"></script>
</body>
</html>
